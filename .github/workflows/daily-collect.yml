# 매일 22시(KST)에 공식 자료만 수집한다. **비용이 들지 않는다** —
# API를 호출하지 않고, 공개 저장소의 Actions는 무료다.
#
# 글쓰기는 사람이 Claude Code에서 한다(구독으로 커버). 자동 생성으로 바꾸려면
# daily-draft.yml의 schedule 주석을 풀면 된다 — 그때부터 API 과금이 시작된다.
name: 일일 수집

on:
  schedule:
    # 22:00 KST = 13:00 UTC. GitHub 부하에 따라 몇 분~그 이상 밀릴 수 있다.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '수집 대상 날짜 (YYYY-MM-DD, 비우면 오늘 KST)'
        required: false

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 대상 날짜 결정 (KST)
        id: d
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(TZ=Asia/Seoul date +%F); fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: 공식 자료 수집
        run: python3 scripts/collect_sources.py --date "${{ steps.d.outputs.date }}"

      - name: 커밋
        run: |
          if [ -z "$(git status --porcelain candidates.json)" ]; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          git commit -m "수집: ${{ steps.d.outputs.date }} 후보 [skip ci]"
          git push

      - name: 알림 이슈 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.d.outputs.date }}"
          N=$(python3 -c "import json;print(len(json.load(open('candidates.json'))['candidates']))")

          if [ "$N" = "0" ]; then
            echo "후보 0건 — 주말·공휴일이면 정상. 이슈를 만들지 않습니다."
            exit 0
          fi

          {
            echo "오늘 나온 공식 자료 **${N}건**을 모았어요. 아직 아무것도 쓰지 않았습니다."
            echo
            echo "### 후보 목록"
            python3 -c "
          import json
          d = json.load(open('candidates.json'))
          for c in d['candidates']:
              body = len(c.get('body') or '')
              mark = '' if body else '  ⚠️ 본문 없음'
              print(f\"- [{c['source']}] {c['title']}{mark}\")
          "
            echo
            echo "---"
            echo
            echo "**다음 할 일**: Claude Code를 열고 \`오늘 콘텐츠 만들어줘\`라고 하세요."
            echo "\`candidates.json\`을 읽어 선정 기준을 적용하고 초안 PR을 만들어 줍니다."
            echo
            echo "> 자료 수집만 자동이고 글쓰기는 수동이에요. 비용을 들이지 않기 위한 선택입니다."
            echo "> 사용자가 생겨서 매일 발행이 중요해지면 \`daily-draft.yml\`의 schedule을 켜면 됩니다."
          } > issue.md

          gh issue create \
            --title "오늘의 후보 ${N}건 — ${DATE}" \
            --body-file issue.md \
            --label "" 2>/dev/null || gh issue create \
            --title "오늘의 후보 ${N}건 — ${DATE}" \
            --body-file issue.md
