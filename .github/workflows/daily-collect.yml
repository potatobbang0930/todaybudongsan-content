# 평일 아침, 그날 콘텐츠 후보를 모아둔다.
#
# 🔴 2026-08-12 에 예약을 껐다가 **2026-08-29 에 다시 켰다.** 전제가 깨졌기 때문이다.
#
#   8/12 — 러너에서 국토교통부·재정경제부·금융위원회가 전부 30초 타임아웃.
#          후보가 21건에서 1건으로 줄었다. 해외·클라우드 IP 차단으로 봤다.
#   8/29 — 같은 호스트를 다시 재보니 **전부 닿는다.** 수집 스크립트를 러너에서
#          실제로 돌려보니 7곳 중 **금융위원회(보도설명) 한 곳만** 실패했다.
#
# **부분 수집 결과는 없는 것보다 나쁘다** 는 판단은 그대로다 — 결과만 보면
# "그날 자료가 적었다" 와 구분이 안 된다. 그래서 실패한 소스를 이슈 본문에 적고,
# 사람이 선정할 때 무엇이 빠졌는지 알 수 있게 한다.
#
# ⚠️ 여기까지가 자동이다. **글은 사람이 쓴다.**
#    CLAUDE.md 금지 항목: "검수 없는 완전 자동 발행".
#
# 배경: docs/DECISION_LOG.md 2026-08-12 (10) · 2026-08-29
name: 일일 수집

on:
  schedule:
    # 평일 07:00 KST = 전날 22:00 UTC. 발행 마감이 오후 6시라 아침에 준비돼 있어야 한다
    - cron: '0 22 * * 0-4'
  workflow_dispatch:
    inputs:
      date:
        description: '수집 대상 날짜 (YYYY-MM-DD, 비우면 오늘 KST)'
        required: false

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 대상 날짜 결정 (KST)
        id: d
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(TZ=Asia/Seoul date +%F); fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: 공식 자료 수집
        # 🔴 키가 없으면 청약홈이 통째로 빠진다. 실패가 아니라 "건너뜀"으로 조용히 지나가서
        #    결과만 봐서는 알 수 없다 (2026-08-29 러너에서 실제로 겪었다).
        env:
          ODCLOUD_API_KEY: ${{ secrets.ODCLOUD_API_KEY }}
        run: python3 scripts/collect_sources.py --date "${{ steps.d.outputs.date }}"

      - name: 커밋
        run: |
          if [ -z "$(git status --porcelain candidates.json)" ]; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          git commit -m "수집: ${{ steps.d.outputs.date }} 후보 [skip ci]"
          git push

      - name: 알림 이슈 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.d.outputs.date }}"
          N=$(python3 -c "import json;print(len(json.load(open('candidates.json'))['candidates']))")

          if [ "$N" = "0" ]; then
            echo "후보 0건 — 주말·공휴일이면 정상. 이슈를 만들지 않습니다."
            exit 0
          fi

          {
            echo "오늘 나온 공식 자료 **${N}건**을 모았어요. 아직 아무것도 쓰지 않았습니다."
            echo
            echo "### 후보 목록"
            python3 -c "
          import json
          d = json.load(open('candidates.json'))
          for c in d['candidates']:
              body = len(c.get('body') or '')
              mark = '' if body else '  ⚠️ 본문 없음'
              print(f\"- [{c['source']}] {c['title']}{mark}\")
          "
            echo
            echo "---"
            echo
            echo "**다음 할 일**: Claude Code를 열고 \`오늘 콘텐츠 만들어줘\`라고 하세요."
            echo "\`candidates.json\`을 읽어 선정 기준을 적용하고 초안 PR을 만들어 줍니다."
            echo
            echo "> 자료 수집만 자동이고 글쓰기는 수동이에요. 비용을 들이지 않기 위한 선택입니다."
            echo "> 사용자가 생겨서 매일 발행이 중요해지면 \`daily-draft.yml\`의 schedule을 켜면 됩니다."
          } > issue.md

          gh issue create \
            --title "오늘의 후보 ${N}건 — ${DATE}" \
            --body-file issue.md \
            --label "" 2>/dev/null || gh issue create \
            --title "오늘의 후보 ${N}건 — ${DATE}" \
            --body-file issue.md
